name: Deploy no GitHub Pages

# Publica a raiz do repo no Pages a cada push na main.
# Requer: Settings > Pages > Source = "GitHub Actions" (uma vez so).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; nao cancela a que ja esta rodando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rodar as checagens
        run: python tools/check.py

  publicar:
    name: Publicar
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
